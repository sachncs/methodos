[project]
name = "methodos"
version = "0.1.0"
description = "Self-evolving procedural graph adapter for LLM agents"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "Sachin", email = "sachncs@gmail.com"},
]
keywords = [
    "llm",
    "agents",
    "procedural-memory",
    "knowledge-graph",
    "self-evolving",
    "graph",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.7",
    "litellm>=1.40",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "aiofiles>=23.2",
    "aiosqlite>=0.20",
    "structlog>=24.1",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
eval = [
    "datasets>=2.14",
    "pandas>=2.0",
    "tiktoken>=0.7",
]
vec = [
    "sqlite-vec>=0.1.6",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "respx>=0.21",
]

[project.scripts]
methodos = "methodos.cli:main"

[project.urls]
Homepage = "https://github.com/sachin/methodos"
Repository = "https://github.com/sachin/methodos"
Issues = "https://github.com/sachin/methodos/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["methodos"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=methodos",
    "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true
source = ["methodos"]

[tool.coverage.report]
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["eval"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D100",  # Missing docstring in public module (modules are usually self-evident)
    "D104",  # Missing docstring in public package
    "COM812", # Missing trailing comma (conflicts with formatter)
    "ISC001", # Single-line implicit string concat (conflicts with formatter)
    "TRY003", # Long exception messages
    "CPY001", # Copyright notice (covered by LICENSE at repo root)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN201", "D"]
"examples/**/*.py" = ["ANN201", "D"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
disallow_untyped_calls = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["eval", "examples"]