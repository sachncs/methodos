version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "build(deps)"
    labels:
      - "dependencies"
      - "python"
    # Group patch/minor updates so Dependabot opens fewer PRs.
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
    # Ignore major bumps to avoid surprise breaking changes; review
    # those manually via the changelog before merging.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
