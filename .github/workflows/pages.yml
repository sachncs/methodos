name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Verify Astro-only site sources
        run: |
          forbidden="$({
            find . -path './.git' -prune -o \
              -path './site/node_modules' -prune -o \
              -path './site/dist' -prune -o \
              -type f \( \
                -name '_config.yml' -o \
                -name '_config.yaml' -o \
                -name 'Gemfile' -o \
                -name 'Gemfile.lock' \
              \) -print
          } | sort)"
          if [ -n "$forbidden" ]; then
            echo "Jekyll source files are not allowed in the Astro site:" >&2
            printf '%s\n' "$forbidden" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
