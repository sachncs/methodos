name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.9.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Verify Python package
        run: |
          uv sync --frozen --all-extras
          uv run ruff check .
          uv run ruff format --check methodos tests scripts eval/hotpotqa/*.py examples
          uv run mypy methodos tests scripts eval/hotpotqa/*.py examples
          uv run pytest --cov=methodos --cov-fail-under=95

      - name: Verify tag matches package version
        run: |
          package_version="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$package_version"

      - name: Build Python artifacts
        run: uv build --out-dir release-artifacts

      - name: Smoke-test built Python wheel
        run: |
          wheel_path="$(find release-artifacts -maxdepth 1 -name '*.whl' -print -quit)"
          wheel_venv="${RUNNER_TEMP}/methodos-release-wheel-venv"
          uv venv --python 3.12 "$wheel_venv"
          uv pip install --python "$wheel_venv/bin/python" "$wheel_path"
          "$wheel_venv/bin/methodos" --help >/dev/null
          "$wheel_venv/bin/python" -c 'import methodos; assert methodos.__version__ == "0.1.0"'

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build and audit site before publishing
        working-directory: site
        run: npm ci && npm run build && npm audit --audit-level=high

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish signed runtime image
        id: image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          sbom: true
          provenance: mode=max

      - name: Write release manifest
        env:
          IMAGE_DIGEST: ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
          PACKAGE_VERSION: ${{ github.ref_name }}
          SOURCE_REVISION: ${{ github.sha }}
        run: >-
          uv run python -c
          'import json, os; from pathlib import Path; Path("release-artifacts/release-manifest.json").write_text(json.dumps({"package_version": os.environ["PACKAGE_VERSION"].removeprefix("v"), "source_revision": os.environ["SOURCE_REVISION"], "image": os.environ["IMAGE_DIGEST"]}, indent=2) + "\n")'

      - name: Verify release manifest
        env:
          IMAGE_DIGEST: ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
          PACKAGE_VERSION: ${{ github.ref_name }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          uv run python scripts/verify_release_manifest.py \
            release-artifacts/release-manifest.json \
            --package-version "${PACKAGE_VERSION#v}" \
            --source-revision "$SOURCE_REVISION" \
            --image "$IMAGE_DIGEST"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign runtime image
        env:
          IMAGE_DIGEST: ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
        run: cosign sign --yes "$IMAGE_DIGEST"

      - name: Verify runtime image signature and provenance
        env:
          IMAGE_DIGEST: ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
        run: >-
          cosign verify "$IMAGE_DIGEST"
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          --certificate-identity
          "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-artifacts/* --verify-tag --generate-notes
