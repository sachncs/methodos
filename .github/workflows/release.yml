name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Verify Python package
        run: uv sync --frozen --all-extras && uv run pytest --cov=methodos --cov-fail-under=95

      - name: Verify tag matches package version
        run: |
          package_version="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$package_version"

      - name: Build Python artifacts
        run: uv build --out-dir release-artifacts

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish signed runtime image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          sbom: true
          provenance: mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1

      - name: Sign runtime image
        env:
          IMAGE_DIGEST: ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
        run: cosign sign --yes "$IMAGE_DIGEST"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build and audit site
        working-directory: site
        run: npm ci && npm run build && npm audit --audit-level=high

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-artifacts/* --verify-tag --generate-notes
