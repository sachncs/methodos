name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.9.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Verify Python package
        run: |
          uv sync --frozen --all-extras
          uv run ruff check .
          uv run ruff format --check methodos tests scripts eval/hotpotqa/*.py examples
          uv run mypy methodos tests scripts eval/hotpotqa/*.py examples
          uv run pytest --cov=methodos --cov-fail-under=95

      - name: Verify tag matches package version
        run: |
          package_version="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$package_version"

      - name: Build Python artifacts
        run: uv build --out-dir release-artifacts

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build and audit site before publishing
        working-directory: site
        run: npm ci && npm run build && npm audit --audit-level=high

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish signed runtime image
        id: image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          sbom: true
          provenance: mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign runtime image
        env:
          IMAGE_DIGEST: ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
        run: cosign sign --yes "$IMAGE_DIGEST"

      - name: Verify runtime image signature and provenance
        env:
          IMAGE_DIGEST: ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
        run: >-
          cosign verify "$IMAGE_DIGEST"
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          --certificate-identity
          "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-artifacts/* --verify-tag --generate-notes
