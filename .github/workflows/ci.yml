name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: methodos
          POSTGRES_PASSWORD: methodos
          POSTGRES_DB: methodos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U methodos -d methodos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      METHODOS_POSTGRES_TEST_DSN: postgresql://methodos:methodos@localhost:5432/methodos
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.9.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Verify formatting
        run: uv run ruff format --check methodos tests scripts eval/hotpotqa/*.py examples

      - name: Type check
        run: uv run mypy methodos tests scripts eval/hotpotqa/*.py examples

      - name: Build and smoke-test Python wheel
        run: |
          wheel_dir="$(mktemp -d)"
          uv build --wheel --out-dir "$wheel_dir"
          wheel_path="$(find "$wheel_dir" -maxdepth 1 -name '*.whl' -print -quit)"
          wheel_venv="${RUNNER_TEMP}/methodos-wheel-venv"
          uv venv --python 3.12 "$wheel_venv"
          uv pip install --python "$wheel_venv/bin/python" "$wheel_path"
          "$wheel_venv/bin/methodos" --help >/dev/null
          "$wheel_venv/bin/python" -c 'import methodos; assert methodos.__version__ == "0.1.0"'

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build Astro site
        working-directory: site
        run: npm ci && npm run build

      - name: Install browser for end-to-end smoke tests
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        working-directory: site
        run: npm run test:e2e

      - name: Audit frontend dependencies
        working-directory: site
        run: npm audit --audit-level=high

      - name: Build runtime container
        run: docker build --tag methodos:ci --file docker/Dockerfile .

      - name: Verify runtime image fails closed without credentials
        run: |
          set +e
          docker run --rm --entrypoint python methodos:ci \
            -c 'import methodos.service' \
            >"${RUNNER_TEMP}/methodos-image-startup.log" 2>&1
          status=$?
          set -e
          cat "${RUNNER_TEMP}/methodos-image-startup.log"
          if [ "$status" -eq 0 ]; then
            echo "runtime image unexpectedly started without credentials" >&2
            exit 1
          fi
          grep -Eq "METHODOS_ENV=production|METHODOS_API_KEYS|METHODOS_TENANT_KEYS" \
            "${RUNNER_TEMP}/methodos-image-startup.log"

      - name: Run container health and load smoke test
        run: |
          docker run --detach --name methodos-ci --publish 8000:8000 \
            --env METHODOS_API_KEYS=ci-container-key-0123456789 \
            --env METHODOS_API_KEY_ROLES=ci-container-key-0123456789=reader \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev \
            --cap-drop ALL --security-opt no-new-privileges:true \
            methodos:ci
          cleanup() {
            docker logs methodos-ci || true
            docker rm --force methodos-ci || true
          }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              exit 1
            fi
            sleep 1
          done
          uv run python scripts/http_load_smoke.py \
            --url http://127.0.0.1:8000/health \
            --requests 1000 \
            --concurrency 25 \
            --rounds 5

      - name: Validate production Compose configuration
        run: |
          docker compose -f docker/compose.yml config --quiet
          compose_config="$(docker compose --profile observability -f docker/compose.yml config)"
          host_local_bindings="$(printf '%s\n' "$compose_config" | grep -c 'host_ip: 127.0.0.1')"
          if [ "$host_local_bindings" -lt 4 ]; then
            echo "expected loopback bindings for API, Prometheus, and OTLP ports" >&2
            exit 1
          fi

      - name: Verify production Compose fails closed without credentials
        run: |
          docker tag methodos:ci methodos:0.1.0
          set +e
          METHODOS_ENV=production \
            METHODOS_API_KEYS='' \
            METHODOS_API_KEY_ROLES='' \
            METHODOS_TENANT_KEYS='' \
            docker compose -f docker/compose.yml run --rm --no-deps \
              --entrypoint python methodos -c 'import methodos.service' \
              >"${RUNNER_TEMP}/methodos-compose-startup.log" 2>&1
          status=$?
          set -e
          cat "${RUNNER_TEMP}/methodos-compose-startup.log"
          if [ "$status" -eq 0 ]; then
            echo "production Compose unexpectedly started without credentials" >&2
            exit 1
          fi
          grep -Eq "METHODOS_API_KEYS|authentication|production" \
            "${RUNNER_TEMP}/methodos-compose-startup.log"
          METHODOS_ENV=production \
            METHODOS_API_KEYS=ci-production-key-0123456789 \
            METHODOS_API_KEY_ROLES=ci-production-key-0123456789=reader \
            METHODOS_TENANT_KEYS='' \
            docker compose -f docker/compose.yml run --rm --no-deps \
              --entrypoint python methodos -c 'import methodos.service'

      - name: Validate Prometheus configuration and alert rules
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}/docker:/etc/prometheus:ro" \
            --entrypoint promtool \
            prom/prometheus:v2.54.1 \
            check config /etc/prometheus/prometheus.yaml
          docker run --rm \
            --volume "${{ github.workspace }}/docker:/etc/prometheus:ro" \
            --entrypoint promtool \
            prom/prometheus:v2.54.1 \
            check rules /etc/prometheus/prometheus-rules.yml

      - name: Validate Grafana dashboard artifact
        run: python -m json.tool docker/grafana-dashboard.json >/dev/null

      - name: Validate OpenTelemetry Collector configuration
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}/docker/otel-collector.yaml:/etc/otelcol/config.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.110.0 \
            validate --config=/etc/otelcol/config.yaml

      - name: Run SQLite backup and restore drill
        run: |
          drill_database="$(mktemp)"
          uv run python -c 'import asyncio, sys; from methodos.repo import SQLiteRepository; from methodos.schema import Node, ProceduralGraph; repository = SQLiteRepository(db_path=sys.argv[1]); asyncio.run(repository.save_graph(ProceduralGraph(id="ci-canary", nodes={"start": Node(id="start")}, terminal_ids={"start"})))' "$drill_database"
          uv run python scripts/sqlite_restore_drill.py "$drill_database" --graph-id ci-canary

      - name: Generate container SBOM
        uses: anchore/sbom-action@v0.24.3
        with:
          image: methodos:ci
          artifact-name: methodos-sbom.spdx.json
          output-file: methodos-sbom.spdx.json

      - name: Scan container for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: methodos:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload container SBOM
        uses: actions/upload-artifact@v7.0.2
        with:
          name: methodos-sbom
          path: methodos-sbom.spdx.json
          retention-days: 14

      - name: Test
        run: uv run pytest --cov=methodos --cov-fail-under=95
