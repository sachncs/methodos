name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy methodos

      - name: Vulnerability scan
        # pip-audit checks the resolved dependency tree against the OSV
        # database. Fails the build on any known CVE so a vulnerable
        # upgrade can't land via a routine uv lock refresh.
        # We export the resolved tree (excluding the local methodos
        # package itself) so pip-audit doesn't try to look it up on
        # PyPI where it doesn't exist.
        run: |
          uv export --no-hashes --no-emit-project -o /tmp/reqs.txt
          uv run pip-audit --strict -r /tmp/reqs.txt

      - name: Test
        run: uv run pytest --cov=methodos --cov-fail-under=95
