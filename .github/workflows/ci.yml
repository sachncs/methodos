name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: methodos
          POSTGRES_PASSWORD: methodos
          POSTGRES_DB: methodos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U methodos -d methodos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      METHODOS_POSTGRES_TEST_DSN: postgresql://methodos:methodos@localhost:5432/methodos
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy methodos tests

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build Astro site
        working-directory: site
        run: npm ci && npm run build

      - name: Install browser for end-to-end smoke tests
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        working-directory: site
        run: npm run test:e2e

      - name: Audit frontend dependencies
        working-directory: site
        run: npm audit --audit-level=high

      - name: Build runtime container
        run: docker build --tag methodos:ci --file docker/Dockerfile .

      - name: Validate production Compose configuration
        run: docker compose -f docker/compose.yml config --quiet

      - name: Generate container SBOM
        uses: anchore/sbom-action@v0
        with:
          image: methodos:ci
          artifact-name: methodos-sbom.spdx.json
          output-file: methodos-sbom.spdx.json

      - name: Scan container for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: methodos:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload container SBOM
        uses: actions/upload-artifact@v4
        with:
          name: methodos-sbom
          path: methodos-sbom.spdx.json
          retention-days: 14

      - name: Test
        run: uv run pytest --cov=methodos --cov-fail-under=95
