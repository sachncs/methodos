groups:
  - name: methodos.service
    interval: 30s
    rules:
      - alert: MethodosHighHttp5xxRate
        expr: |
          sum(rate(methodos_http_requests_total{status=~"5.."}[5m]))
            /
          sum(rate(methodos_http_requests_total[5m])) > 0.05
        for: 10m
        labels:
          severity: page
        annotations:
          summary: Methodos HTTP server error rate is high
          description: More than 5% of requests returned 5xx for 10 minutes.

      - alert: MethodosHighHttpLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(methodos_http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: Methodos HTTP p95 latency is high
          description: HTTP p95 latency exceeded one second for 10 minutes.

      - alert: MethodosLlmFailureRate
        expr: |
          sum(rate(methodos_llm_attempts_total{outcome="failed"}[5m]))
            /
          sum(rate(methodos_llm_attempts_total{outcome=~"started|succeeded|failed"}[5m])) > 0.20
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: Methodos LLM failure rate is high
          description: More than 20% of observed provider attempts failed.

      - alert: MethodosLlmBudgetRejections
        expr: sum(rate(methodos_llm_attempts_total{outcome="budget_rejected"}[15m])) > 0
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: Methodos requests are hitting LLM budgets
          description: At least one LLM request was budget-rejected during the window.

      - alert: MethodosMetricsTargetMissing
        expr: absent(up{job="methodos"}) or up{job="methodos"} == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: Methodos metrics target is unavailable
          description: Prometheus cannot scrape the Methodos service.

      - alert: MethodosEvolutionQueueBacklog
        expr: methodos_evolution_jobs{state="queued"} > 100
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: Methodos evolution queue is backing up
          description: More than 100 evolution jobs have been queued for 10 minutes.

      - alert: MethodosEvolutionWorkerDown
        expr: methodos_evolution_worker{state="running"} == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: Methodos evolution worker is not running
          description: A deployment configured with a worker has reported no running worker for 5 minutes.

      - alert: MethodosEvolutionWorkerErrors
        expr: methodos_evolution_worker{state="consecutive_errors"} > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: Methodos evolution worker is experiencing errors
          description: The supervised worker has had consecutive storage or queue errors for 5 minutes.
