services:
  methodos:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: methodos:0.1.0
    ports:
      - "8000:8000"
    environment:
      METHODOS_ENV: ${METHODOS_ENV:-production}
      PGRAPH_BACKEND: sqlite
      PGRAPH_HOME: /data
      METHODOS_API_KEYS: ${METHODOS_API_KEYS:-}
      METHODOS_API_KEY_ROLES: ${METHODOS_API_KEY_ROLES:-}
      METHODOS_TENANT_KEYS: ${METHODOS_TENANT_KEYS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - methodos-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Opt-in observability profile (run with `--profile observability`)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yaml"]
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

volumes:
  methodos-data:
    name: methodos-data
